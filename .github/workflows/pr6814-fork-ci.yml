# Fork-only validation. Keep this workflow commit out of the upstream PR.
# Reuses the upstream PR test jobs and both labels currently applied to PR 6814.
name: PR6814 fork validation

on:
  push:
    branches: [ci/pr-6814-andy-review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'LinSimon-901101/datafusion-comet'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Apache RAT license check
        run: ./dev/release/check-rat.sh HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install prettier
        run: npm install -g prettier

      - name: Check markdown formatting
        run: prettier --check "**/*.md"

      # The site draws its ```mermaid fences with mmdc at build time, and
      # sphinxcontrib-mermaid turns any render failure into a warning and a
      # dropped diagram, so the deploy stays green and the page publishes with
      # a hole in it (issue #6062). The docs job runs only on push to main, so
      # rendering the fences here is the only chance to catch that before it
      # publishes. Kept identical to the same pair of steps in docs.yaml.
      - name: Install mermaid-cli
        run: |
          set -eux
          # ubuntu-slim carries none of Chrome's shared libraries, so the browser downloads
          # fine and then dies with `libatk-1.0.so.0: cannot open shared object file`. These
          # are what chrome-headless-shell actually links against; libgtk-3 pulls in most of
          # the rest (atk, cairo, pango, gdk-pixbuf) as dependencies.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libatk-bridge2.0-0t64 \
            libcups2t64 libxkbcommon0 libxdamage1 libxcomposite1 libxrandr2 libxfixes3
          npm install --prefix "$RUNNER_TEMP/mermaid" "$(python3 dev/ci/check-mermaid.py --cli-spec)"
          # puppeteer's postinstall fetches the browser mmdc drives, but it catches its own
          # download failures and exits 0, so a flaky fetch leaves a green install step and an
          # mmdc that cannot launch. Fetch it again here, where a failure fails the job.
          npm --prefix "$RUNNER_TEMP/mermaid" exec -- puppeteer browsers install chrome-headless-shell
          echo "$RUNNER_TEMP/mermaid/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check mermaid diagrams render
        run: python3 dev/ci/check-mermaid.py

      - name: Check missing suites
        run: python3 dev/ci/check-suites.py

      - name: Check versioned source parity
        run: python3 dev/ci/check-versioned-source-parity.py

      - name: Check micro benchmark runner
        run: python3 dev/ci/check-benchmark-runner.py

      - name: Check pull request type labeling
        run: node --test dev/ci/pr-type-label.test.mjs

      - name: Check Iceberg shard inventory validation
        run: python3 dev/ci/test-iceberg-shards.py

      - name: Check Iceberg write report summary
        run: python3 dev/ci/test-summarize-iceberg-writes.py

      - name: Check CI config invariants
        run: python3 dev/ci/check-ci-config.py

      - name: Install actionlint
        # Pure network, and preflight gates every other job, so a single reset
        # connection here would fail the whole run. Download to a file rather
        # than pipe into bash so a failed download cannot run a partial script.
        run: |
          for attempt in 1 2 3; do
            if curl -sSfL --retry 3 --retry-all-errors -o download-actionlint.bash \
                 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash \
               && bash download-actionlint.bash; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::actionlint download failed after 3 attempts."
              exit 1
            fi
            echo "::warning::actionlint download failed (attempt $attempt of 3); retrying in $((attempt * 10))s."
            sleep $((attempt * 10))
          done
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Lint GitHub Actions workflows
        run: actionlint -color --shellcheck=off


  linux:
    name: PR Build (Linux)
    needs: preflight
    uses: ./.github/workflows/pr_build_linux.yml
    with:
      cache-refresh-only: false
      profiles: pr

  spark_3_4:
    name: Spark SQL Tests (Spark 3.4)
    needs: preflight
    uses: ./.github/workflows/spark_sql_test_reusable.yml
    with:
      spark-short: '3.4'
      spark-full: '3.4.3'
      java: 17

  iceberg:
    name: Iceberg Spark SQL Tests (Iceberg ${{ matrix.iceberg-short }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - iceberg-short: '1.8'
            iceberg-full: '1.8.1'
            spark-short: '3.4'
            spark-full: '3.4.3'
          - iceberg-short: '1.9'
            iceberg-full: '1.9.1'
            spark-short: '3.5'
            spark-full: '3.5.9'
          - iceberg-short: '1.10'
            iceberg-full: '1.10.0'
            spark-short: '3.5'
            spark-full: '3.5.9'
          - iceberg-short: '1.11'
            iceberg-full: '1.11.0'
            spark-short: '4.1'
            spark-full: '4.1.3'
    uses: ./.github/workflows/iceberg_spark_test_reusable.yml
    with:
      iceberg-short: ${{ matrix.iceberg-short }}
      iceberg-full: ${{ matrix.iceberg-full }}
      spark-short: ${{ matrix.spark-short }}
      spark-full: ${{ matrix.spark-full }}
      java: 17

  spark34_iceberg:
    needs: preflight
    if: github.repository == 'LinSimon-901101/datafusion-comet'
    name: CometIcebergNativeSuite (Spark 3.4, Scala 2.12, JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED'
    env:
      RUST_BACKTRACE: '1'
      RUSTFLAGS: '-Ctarget-cpu=x86-64-v3 -Clink-arg=-fuse-ld=bfd'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'

      - name: Restore Cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

      - name: Build native library
        working-directory: native
        run: cargo build --locked --profile ci

      - name: Stage native library
        run: |
          mkdir -p native/target/release
          cp native/target/ci/libcomet.so native/target/release/

      - name: Run Spark 3.4 Iceberg tests
        uses: ./.github/actions/java-test
        with:
          artifact_name: pr6814-spark34
          suites: org.apache.comet.CometIcebergNativeSuite
          maven_opts: '-Pspark-3.4 -Pscala-2.12 -Dtest=none -DfailIfNoTests=false'
          skip-native-build: 'true'
          upload-test-reports: 'true'

      - name: Confirm all seven regression tests passed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          report = Path('spark/target/surefire-reports/SparkTestSuite.txt').read_text()
          for name in (
              'DPP - global aggregate after pruning a single split (AQE=false)',
              'DPP - global aggregate after pruning a single split (AQE=true)',
              'DPP - single-split sort-merge join (AQE=false, pruned=a)',
              'DPP - single-split sort-merge join (AQE=false, pruned=b)',
              'DPP - single-split sort-merge join (AQE=true, pruned=a)',
              'DPP - single-split sort-merge join (AQE=true, pruned=b)',
              'DPP - empty Iceberg scan does not request S3 policy locations',
          ):
              matches = [line for line in report.splitlines() if name in line]
              assert len(matches) == 1, f'Expected exactly one result for {name}: {matches}'
              assert not any(state in matches[0] for state in ('FAILED', 'CANCELED', 'IGNORED', 'PENDING')), matches[0]
              print(matches[0])
          PY

  analyze:
    name: Analyze Actions
    needs: preflight
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        languages: actions

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      with:
        category: "/language:actions"


  results:
    name: Fork validation results
    if: always() && github.repository == 'LinSimon-901101/datafusion-comet'
    needs: [preflight, linux, spark_3_4, iceberg, spark34_iceberg, analyze]
    permissions: {}
    runs-on: ubuntu-slim
    steps:
      - name: Require all validation jobs to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json
          import os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in jobs.items()
                    if job['result'] != 'success'}
          assert not failed, f'Validation did not succeed: {failed}'
          print('All PR-equivalent checks and Spark 3.4 Iceberg regressions passed.')
          PYRESULT

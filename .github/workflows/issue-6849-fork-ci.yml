# Fork-only validation; do not include this workflow commit in an upstream patch.
name: Issue 6849 SQL file validation

on:
  push:
    branches: [ci/issue-6849-validation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-Ctarget-cpu=x86-64-v3 -Clink-arg=-fuse-ld=bfd'

jobs:
  native:
    name: Build native library
    if: github.repository == 'LinSimon-901101/datafusion-comet'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: amd64/rust
    outputs:
      profiles: ${{ steps.profiles.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Select every supported Comet test profile
        id: profiles
        run: python3 dev/ci/linux-test-profiles.py --profiles all --github-output "$GITHUB_OUTPUT"

      - name: Set up Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: '17'

      - name: Restore Cargo cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}

      - name: Build native library with release overflow behavior
        working-directory: native
        run: cargo build --locked --profile ci

      - name: Upload native library
        uses: ./.github/actions/upload-artifact-retry
        with:
          name: issue-6849-native-linux
          path: |
            native/target/ci/libcomet.so
            native/target/ci/libcomet_test_udfs.so
          retention-days: 1

  sql-files:
    name: SQL files (${{ matrix.profile.name }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.native.outputs.profiles) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: amd64/rust
      env:
        JAVA_TOOL_OPTIONS: '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED --add-exports=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust and Java
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
          jdk-version: ${{ matrix.profile.java_version }}

      - name: Download native library
        uses: ./.github/actions/download-artifact-retry
        with:
          name: issue-6849-native-linux
          path: native/target/release/

      - name: Run timestamp SQL files
        uses: ./.github/actions/java-test
        with:
          artifact_name: issue-6849-${{ matrix.profile.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The suites input becomes -DwildcardSuites in MAVEN_OPTS and cannot
          # carry a space. Pass a quoted -Dsuites on the Maven command line so
          # ScalaTest receives the suite name plus its timestamp substring.
          maven_opts: >-
            ${{ matrix.profile.maven_opts }} -Dtest=none -DfailIfNoTests=false
            -Dsuites='org.apache.comet.CometSqlFileTestSuite timestamp'
          upload-test-reports: 'true'
          skip-native-build: 'true'

      - name: Verify new fixtures ran and summarize coverage
        env:
          PROFILE_NAME: ${{ matrix.profile.name }}
        run: |
          python3 - <<'PYREPORT'
          import os
          import re
          from pathlib import Path

          report = Path('spark/target/surefire-reports/SparkTestSuite.txt').read_text()
          report = re.sub(r'\x1b\[[0-9;]*m', '', report)
          lines = report.splitlines()
          log = Path('spark/target/unit-tests.log').read_text()
          profile = os.environ['PROFILE_NAME']
          spark34 = profile.startswith('Spark 3.4,')
          fixtures = (
              'expressions/cast/timestamp_labels.sql',
              'expressions/datetime/timestamp_labels.sql',
              'expressions/datetime/convert_timestamp_labels.sql',
          )
          zones = ('UTC', 'Etc/UTC', 'America/Los_Angeles')
          outcomes = []
          for fixture in fixtures:
              version_skips = [line for line in log.splitlines()
                               if 'SKIPPED (' in line and line.endswith(': ' + fixture)]
              expected_skips = 3 if spark34 and 'convert_timestamp_labels' in fixture else 0
              assert len(version_skips) == expected_skips, (fixture, version_skips)
              if expected_skips:
                  assert all('requires Spark >= 3.5' in line for line in version_skips)
              for zone in zones:
                  name = f'sql-file: {fixture} [spark.sql.session.timeZone={zone}]'
                  matches = [line for line in lines if line.startswith('- ' + name)]
                  assert len(matches) == 1, (name, matches)
                  assert not any(state in matches[0] for state in
                                 ('FAILED', 'CANCELED', 'IGNORED', 'PENDING')), matches[0]
                  outcome = 'version-skipped (requires Spark >= 3.5)' if expected_skips else 'passed'
                  outcomes.append((name, outcome))

          selected = [line for line in lines if line.startswith('- sql-file: ')]
          assert selected and all('timestamp' in line for line in selected), selected
          assert len([line for line in selected if 'timestamp_labels.sql [' in line]) == 9
          for neighbor in ('expressions/datetime/timestamp_seconds.sql',
                           'expressions/datetime/trunc_timestamp.sql',
                           'expressions/cast/cast_timestamp_ntz.sql'):
              assert any(line.startswith('- sql-file: ' + neighbor) for line in selected), neighbor

          executed = sum(outcome == 'passed' for _, outcome in outcomes)
          assert executed == (6 if spark34 else 9), outcomes
          summary = [f'## {profile}', '',
                     f'New fixture cases: {executed} passed; {9 - executed} version-skipped.',
                     f'Total timestamp fixture results: {len(selected)}.', '',
                     '| New fixture case | Result |', '| --- | --- |']
          summary.extend(f'| `{name}` | {outcome} |' for name, outcome in outcomes)
          summary_text = '\n'.join(summary) + '\n'
          print(summary_text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary_text)
          PYREPORT

      - name: Upload timestamp validation logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: issue-6849-timestamp-logs-${{ matrix.profile.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            spark/target/unit-tests.log
            spark/target/surefire-reports/SparkTestSuite.txt
            spark/target/surefire-reports/*.xml
          if-no-files-found: ignore
          retention-days: 7

  results:
    name: Issue 6849 validation results
    if: always() && github.repository == 'LinSimon-901101/datafusion-comet'
    needs: [native, sql-files]
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - name: Require all five profiles to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYRESULT'
          import json
          import os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failed = {name: job['result'] for name, job in jobs.items()
                    if job['result'] != 'success'}
          assert not failed, f'Validation did not succeed: {failed}'
          print('Timestamp SQL fixtures passed across all five supported Spark profiles.')
          PYRESULT
